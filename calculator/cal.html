<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>CALCULATOR</title>
    <link rel="stylesheet" href="cla.css">
</head>
<body>
    <div id="dh">
            <input type="text" id = "di" readonly>
        <div id="db">
            <button onclick="dis('+')" class="butt">+</button>
            <button onclick="dis('7')" class="butt">7</button>
            <button onclick="dis('8')" class="butt">8</button>
            <button onclick="dis('9')" class="butt">9</button>
       
            <button onclick="dis('-')" class="butt">-</button>

            <button onclick="dis('5')" class="butt">5</button>
            <button onclick="dis('6')" class="butt">6</button>

            <button onclick="dis('0')" class="butt">0</button>
            <button onclick="dis('.')" class="butt">.</button>
            <button onclick="calculate()" class="butt">=</button>
